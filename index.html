<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Daily Tasks</h1>

        <form class="add-task-form" id="addTaskForm">
            <input 
                type="text" 
                class="add-task-input" 
                placeholder="Add a new task..."
                id="newTaskInput"
            >
            <button type="submit" class="add-task-button">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="10" cy="10" r="8"/>
                    <line x1="10" y1="6" x2="10" y2="14"/>
                    <line x1="6" y1="10" x2="14" y2="10"/>
                </svg>
                Add Task
            </button>
        </form>

        <div class="tabs">
            <button class="tab active" data-tab="pending">
                Pending <span class="tab-count" id="pendingCount">0</span>
            </button>
            <button class="tab" data-tab="completed">
                Completed <span class="tab-count" id="completedCount">0</span>
            </button>
        </div>

        <div class="task-list" id="pendingTasks"></div>
        <div class="task-list" id="completedTasks" hidden></div>
    </div>

    <script src="index.js"> </script>
</body>
</html>
